[package]
name = "casdog-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
glory = { version = "=0.7.0", default-features = false, features = ["web"] }
sapid = { version = "=0.7.1", features = ["files"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "DomException", "Element", "Event", "EventTarget", "History", "HtmlHeadElement", "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "KeyboardEvent", "Location", "UrlSearchParams", "Window"] }
gloo-net = "0.6"
gloo-storage = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
qrcode = { version = "0.14", default-features = false }

[workspace]
